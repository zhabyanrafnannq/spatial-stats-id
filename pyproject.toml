[project]
name = "spatial-stats-id"
version = "0.1.0"
description = "Statistik spasial kabupaten/kota Indonesia: Moran's I, LISA, regresi spasial, dengan geometri turunan BIG dan indikator BPS/SSGI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "spatial-stats-id" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "plotly>=5.22",
    "streamlit>=1.36",
    "libpysal>=4.9",
    "esda>=2.6",
    "spreg>=1.4",
]

[project.optional-dependencies]
# dipakai script pipeline dan pengembangan, tidak dibutuhkan runtime dashboard
pipeline = ["shapely>=2.0", "pdfplumber>=0.11", "requests>=2.31", "openpyxl>=3.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
